<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Oracle 調校室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* layout concept: 左側是固定的儀表板（看症狀），右側是參數面板（動手調），底部黏著套用列 */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F4F6F8; --ink:#14202B; --ink2:#566472; --line:#D6DCE2; --track:#D3DAE1;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-bg:#E6ECFD;
  --ok:#0F7F5A; --ok-bg:#DDF3EA; --warn:#9A5B00; --warn-bg:#FCEBCB; --crit:#C42B2B; --crit-bg:#FADCDC;
  --font:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --surface:#151D24; --surface2:#1B252E; --ink:#E6ECF1; --ink2:#9BA9B6; --line:#2A3743; --track:#33414D;
  --accent:#7FA0FF; --accent-ink:#0B1220; --accent-bg:#1E2A4A;
  --ok:#3CCB97; --ok-bg:#12372C; --warn:#F0A63A; --warn-bg:#3A2D12; --crit:#FF8080; --crit-bg:#41191B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1318; --surface:#151D24; --surface2:#1B252E; --ink:#E6ECF1; --ink2:#9BA9B6; --line:#2A3743; --track:#33414D;
  --accent:#7FA0FF; --accent-ink:#0B1220; --accent-bg:#1E2A4A;
  --ok:#3CCB97; --ok-bg:#12372C; --warn:#F0A63A; --warn-bg:#3A2D12; --crit:#FF8080; --crit-bg:#41191B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--font)}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.02em;line-height:1.2}
.brand p{color:var(--ink2);font-size:12.5px}
.top-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.speed button{border:0;background:none;padding:6px 12px;font-size:13px}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.ghost{background:none}

.tabs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;text-align:left;min-width:150px}
.tab small{display:block;color:var(--ink2);font-size:11.5px}
.tab b{display:block;font-weight:500}
.tab[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab .st{color:var(--warn);letter-spacing:.1em;font-size:12px}

.layout{display:grid;gap:16px;margin-top:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){
  .layout{grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}
  .dash{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin}
}
.dash,.work{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3,.card h4{font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.06em;margin-bottom:8px}

/* 狀態 */
.stat-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lamp{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none}
.lamp.warn{background:var(--warn);animation:blink 1s infinite}
.lamp.crit{background:var(--crit)}
@keyframes blink{50%{opacity:.35}}
.stat-top b{font-size:15px}
.stat-top span{color:var(--ink2);font-size:12.5px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.steps li{font-size:11.5px;text-align:center;padding:5px 2px;border-radius:6px;background:var(--surface2);color:var(--ink2)}
.steps li.on{background:var(--ok-bg);color:var(--ok);font-weight:700}
.steps li.cur{background:var(--warn-bg);color:var(--warn);font-weight:700}
.failbox{margin-top:12px;border-radius:8px;background:var(--crit-bg);color:var(--crit);padding:10px 12px}
.failbox p{margin-bottom:8px;font-weight:500}
.failbox .row{display:flex;gap:8px;flex-wrap:wrap}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;min-width:0}
.kpi .kl{font-size:12px;color:var(--ink2)}
.kpi .kv{font:500 24px/1.25 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .kv small{font:400 12px var(--font);color:var(--ink2);margin-left:4px}
.kpi .ks{font-size:11.5px;color:var(--ink2)}
.kpi.k-ok .kv{color:var(--ok)} .kpi.k-warn .kv{color:var(--warn)} .kpi.k-crit .kv{color:var(--crit)}

svg.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--ink2);font:10px var(--mono)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .ar{fill:var(--accent);opacity:.12;stroke:none}
.chart .gd{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:5 4}
.chart .gt{fill:var(--ok);font:10px var(--font)}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}

/* 記憶體 */
.membar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.membar i{display:block;height:100%}
.m-os{background:var(--ink2)} .m-sga{background:var(--accent)} .m-rsv{background:repeating-linear-gradient(45deg,var(--accent-bg),var(--accent-bg) 4px,var(--surface2) 4px,var(--surface2) 8px)}
.m-pga{background:var(--ok)} .m-over{background:var(--crit)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
.memnote{margin-top:6px;font-size:12px;color:var(--crit);font-weight:500}

/* 等待事件 */
.wait{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:2px 8px;align-items:center;margin-bottom:8px}
.wait .wn{min-width:0}
.wait .wn b{font-weight:500;font-size:13px}
.wait .wn code{display:block;font:11px var(--mono);color:var(--ink2);overflow-wrap:anywhere}
.wait .wp{font:12px var(--mono);text-align:right;color:var(--ink2)}
.wait .wb{grid-column:1/3;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.wait .wb i{display:block;height:100%;background:var(--warn);border-radius:3px}
.wait:first-child .wb i{background:var(--crit)}

/* 事件 */
.log li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.log li:last-child{border:0}
.log time{font:11.5px var(--mono);color:var(--ink2);padding-top:1px}
.log .crit{color:var(--crit)} .log .ok{color:var(--ok)} .log .warn{color:var(--warn)}

/* 右側 */
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent);margin-bottom:6px}
.story h2{font-size:19px;margin-bottom:6px}
.story p{color:var(--ink2);max-width:62ch}
.goals{margin-top:12px;display:grid;gap:6px}
.goals li{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.goals .mk{width:18px;flex:none;text-align:center;font-weight:700;color:var(--ink2)}
.goals li.pass .mk{color:var(--ok)} .goals li.fail .mk{color:var(--crit)}
.goals .cur{margin-left:auto;font:12.5px var(--mono);color:var(--ink2);white-space:nowrap}
.streak{display:flex;align-items:center;gap:10px;margin-top:12px}
.streak .sbar{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.streak .sbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.streak span{font:12.5px var(--mono);color:var(--ink2);white-space:nowrap}
.hintrow{margin-top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hints li{font-size:13px;background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:6px 10px;margin-top:6px}

.guide{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--ink2);padding:2px 2px 0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.b-dyn{background:var(--ok-bg);color:var(--ok)} .b-def{background:var(--warn-bg);color:var(--warn)} .b-static{background:var(--crit-bg);color:var(--crit)}

.pgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px 4px;min-width:0}
.pgroup>h3{font-size:12.5px;color:var(--ink2);letter-spacing:.06em;margin-bottom:4px}
.prow{padding:12px 0;border-top:1px solid var(--line);min-width:0}
.pgroup>h3+.prow{border-top:0}
.prow.staged{background:var(--accent-bg);margin-inline:-16px;padding-inline:16px}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plabel{font-weight:500;font-size:14.5px}
.pname{display:block;font:11px var(--mono);color:var(--ink2);overflow-wrap:anywhere}
.pctl{display:flex;align-items:center;gap:12px;margin-top:6px}
.pctl output{font:500 14px var(--mono);min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
.phint{font-size:12.5px;color:var(--ink2);margin-top:2px}
.pnote{font-size:12px;margin-top:4px;color:var(--ink2);font-family:var(--mono)}
.pnote.pend{color:var(--crit)} .pnote.warn{color:var(--warn)}
.chip{font-size:11px;font-weight:700;color:var(--accent);margin-left:6px}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent);margin-top:-7px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.seg button{flex:1 1 150px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;text-align:left}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:700}

.bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--ink2);border-radius:12px;padding:12px 16px;box-shadow:0 6px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:10px;z-index:5}
.bar h4{font-size:12px;color:var(--ink2);letter-spacing:.06em;margin-bottom:4px}
.bar-idle{color:var(--ink2);font-size:13px}
.chg li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:13px;padding:2px 0}
.chg .cv{font-family:var(--mono);color:var(--ink2);font-size:12.5px;margin-left:auto}
.persist{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.persist input{width:16px;height:16px;accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msgs li{font-size:12.5px;padding:2px 0}
.msgs .e{color:var(--crit)} .msgs .o{color:var(--ok)} .msgs .i{color:var(--warn)}
.pend li{font-size:12.5px;font-family:var(--mono);color:var(--warn);padding:1px 0;overflow-wrap:anywhere}
.confirm{background:var(--warn-bg);border-radius:8px;padding:10px 12px}
.confirm p{margin-bottom:8px;font-size:13px}
.divider{border:0;border-top:1px solid var(--line);margin:0}

.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.node{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface2);display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.node b{font-size:13px;font-weight:700}
.node.up{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.node.boot{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.node.fail{border-color:var(--crit);background:var(--crit-bg);color:var(--crit)}
.fbar{height:14px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.fbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.fra.warn .fbar i{background:var(--warn)} .fra.crit .fbar i{background:var(--crit)}
.fl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:12px var(--mono);color:var(--ink2);margin-top:6px}
.fra.crit .fl{color:var(--crit)}
#fraBtn{margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(5,10,15,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay[hidden]{display:none}
.win{background:var(--surface);border-radius:16px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:22px 22px 18px;border:1px solid var(--line)}
.win h2{font-size:22px}
.win .big{font-size:34px;color:var(--warn);letter-spacing:.15em;margin:4px 0 2px}
.win h4{font-size:12.5px;color:var(--ink2);margin:14px 0 6px;letter-spacing:.06em}
.win li{font-size:13.5px;padding:3px 0;display:flex;gap:8px}
.win li .mk{flex:none;width:18px;font-weight:700;color:var(--ok)} .win li.no .mk{color:var(--ink2)}
.win .row{margin-top:16px;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <ellipse cx="17" cy="8" rx="11" ry="4.5"/><path d="M6 8v9c0 2.5 4.9 4.5 11 4.5S28 19.5 28 17V8"/><path d="M6 17v9c0 2.5 4.9 4.5 11 4.5S28 28.5 28 26v-9"/>
      </svg>
      <div><h1>Oracle 調校室</h1><p>調參數、看症狀，分清楚哪些要重啟</p></div>
    </div>
    <div class="top-r">
      <div class="speed" role="group" aria-label="模擬速度">
        <button data-act="speed" data-v="0" aria-pressed="false">暫停</button>
        <button data-act="speed" data-v="1" aria-pressed="true">1×</button>
        <button data-act="speed" data-v="3" aria-pressed="false">3×</button>
      </div>
      <button class="btn ghost" data-act="reset">重玩此關</button>
    </div>
  </header>
  <nav id="tabs" class="tabs" aria-label="情境"></nav>

  <div class="layout">
    <aside class="dash" aria-label="資料庫儀表板">
      <section class="card" id="status"></section>
      <section class="kpis" id="kpis"></section>
      <section class="card"><h4>回應時間</h4><svg class="chart" id="cLat" viewBox="0 0 400 120" role="img" aria-label="回應時間走勢圖"></svg></section>
      <section class="card"><h4>每秒交易數</h4><svg class="chart" id="cTps" viewBox="0 0 400 120" role="img" aria-label="每秒交易數走勢圖"></svg></section>
      <section class="card"><h4>伺服器記憶體</h4><div id="mem"></div></section>
      <section class="card" id="racCard" hidden></section>
      <section class="card" id="fraCard" hidden></section>
      <section class="card"><h4>資料庫都在等什麼</h4><div id="waits"></div></section>
      <section class="card"><h4>事件紀錄</h4><ul class="log" id="log"></ul></section>
    </aside>

    <main class="work">
      <section class="card story" id="story"></section>
      <div class="guide" aria-label="標籤說明">
        <span>參數生效時機：</span>
        <span><span class="badge b-dyn">即時生效</span> 套用後馬上改變</span>
        <span><span class="badge b-def">新連線生效</span> 舊連線不受影響</span>
        <span><span class="badge b-static">需重啟</span> 重啟資料庫才會改變</span>
      </div>
      <div id="params" style="display:flex;flex-direction:column;gap:12px"></div>
      <section class="bar" id="bar" aria-label="套用變更"></section>
    </main>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="winTitle" id="winBox"></div>
</div>
<script>
'use strict';
/* ===== 模型：參數、情境、效能計算（純函式） ===== */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

const KIND = {
  static:   { cls: 'b-static', text: '需重啟' },
  dynamic:  { cls: 'b-dyn',    text: '即時生效' },
  deferred: { cls: 'b-def',    text: '新連線生效' }
};

const GROUPS = [
  { id: 'mem',  title: '記憶體' },
  { id: 'conn', title: '連線與游標' },
  { id: 'sql',  title: 'SQL 與優化器' },
  { id: 'io',   title: '寫入與日誌' },
  { id: 'par',  title: '平行與還原' },
  { id: 'arch', title: '歸檔與備份' },
  { id: 'rac',  title: '叢集 RAC' }
];

const PARAMS = [
  { k: 'sga_max_size', name: 'SGA_MAX_SIZE', group: 'mem', label: 'SGA 記憶體上限', kind: 'static', unit: 'GB',
    hint: 'SGA 的天花板。調高或調低都要重啟才會生效。' },
  { k: 'sga_target', name: 'SGA_TARGET', group: 'mem', label: 'SGA 目前大小', kind: 'dynamic', unit: 'GB',
    hint: '資料快取與共用池的總量。在上限以內可以即時增減。' },

const usersAt = (w, t) => Math.round(w.users * (w.curve ? w.curve(t) : 1 + 0.08 * Math.sin(t / 7)));

function inFailure(w, t) {
  if (!w.failure) return false;
  const x = ((t % w.failure.every) + w.failure.every) % w.failure.every;
  return x >= w.failure.at && x < w.failure.at + w.failure.dur;
}
function fraTargetOf(cfg, w) { return cfg.archivelog === 'ARCHIVELOG' ? w.redoMBps * 3.6 * cfg.arch_keep : 0; }

function validateSga(cfg) {
  if (cfg.asmm === 'OFF') {
    const sum = cfg.shared_pool_size + cfg.db_cache_size + 0.5;
    if (sum > cfg.sga_max_size)
      return { ok: false, msg: `共用池 ${cfg.shared_pool_size} GB 加資料快取 ${cfg.db_cache_size} GB，再加其他區塊共 ${sum} GB，超過 SGA 上限 ${cfg.sga_max_size} GB (ORA-00384)` };
  } else {
    const tgt = Math.min(cfg.sga_target, cfg.sga_max_size), floor = cfg.shared_pool_size + cfg.db_cache_size;
    if (floor > tgt * 0.92)
      return { ok: false, msg: `共用池與資料快取的最小值加起來 ${floor} GB，超過 SGA 目前大小 ${tgt} GB 能分配的 ${(tgt * 0.92).toFixed(1)} GB (ORA-00824)` };
  }
  return { ok: true };
}

function startupCheck(cfg, w) {
  if (cfg.sga_max_size + cfg.pga > w.ram - 1) {
    return { ok: false,
      msg: `記憶體不足：SGA 上限 ${cfg.sga_max_size} GB 加 PGA ${cfg.pga} GB 超過可用的 ${w.ram - 1} GB，無法建立執行個體` };
  }
  const v = validateSga({ ...cfg, sga_target: Math.min(cfg.sga_target, cfg.sga_max_size) });
  if (!v.ok) return { ok: false, msg: '參數檔的 SGA 設定互相矛盾：' + v.msg };
  return { ok: true };
}

function compute(cfg, w, t, warm, ext) {
  ext = ext || {};
  const racOn = cfg.cluster_db === 'TRUE';
  const nodesCfg = racOn ? (ext.nodes != null ? ext.nodes : cfg.rac_nodes) : 1;
  const failing = inFailure(w, t);
  let alive = nodesCfg;
  if (failing) {
    if (nodesCfg < 1.99) return { outage: true, err: 1, failing, alive: 0, nodes: nodesCfg };
    alive = nodesCfg - 1;
  }
  const part = cfg.svc_route === 'PARTITIONED';
  const sNeed = w.sharedNeed * (cfg.cursor_sharing === 'FORCE' ? 0.5 : 1);

  /* 記憶體：ASMM 開啟時自動分配，關閉時使用固定大小 */
  const asmmOn = cfg.asmm !== 'OFF';
  let sga, shared, cache;
  if (asmmOn) {
    sga = Math.min(cfg.sga_target, cfg.sga_max_size);
    shared = Math.max(cfg.shared_pool_size, Math.min(sNeed * 1.3, sga * 0.4));
    cache = Math.max(cfg.db_cache_size, sga * 0.92 - shared);
  } else {
    shared = cfg.shared_pool_size; cache = cfg.db_cache_size;
    sga = Math.min(shared + cache + 0.5, cfg.sga_max_size);
  }
  const pga = cfg.pga;
  const resident = sga + pga + 1;
  const swapMul = 1 + Math.max(0, (resident - w.ram) / w.ram) * 14;
  const wsEff = racOn && part ? w.workingSet / Math.max(1, alive) : w.workingSet;
  const hitRaw = clamp(1 - Math.exp(-2 * cache / wsEff), 0.3, 0.9995);
  const hit = hitRaw * warm + 0.3 * (1 - warm);
  const shErr = w.literal > 0.2 && shared < sNeed * 0.7 ? clamp((sNeed * 0.7 - shared) / (sNeed * 0.7), 0, 1) * 0.4 : 0;

  const users = usersAt(w, t);
  const connected = Math.min(users, Math.max(0, (cfg.processes - 40) * alive));
  const connErr = users > 0 ? 1 - connected / users : 0;
  const curErr = cfg.open_cursors < w.cursorsNeed ? clamp((w.cursorsNeed - cfg.open_cursors) / w.cursorsNeed, 0, 1) * 0.6 : 0;
  const coresTot = w.cores * alive;

  const hard = cfg.cursor_sharing === 'FORCE' ? w.literal * 0.04 : w.literal;
  const scc = clamp(cfg.session_cached_cursors / w.hotCursors, 0, 1);
  const parse = hard * w.hardCost + (1 - hard) * 0.4 * (1 - 0.6 * scc);
  const latch = hard * Math.max(0, 1 - shared / sNeed) * 12;
  const dbwrCpu = Math.max(0, cfg.dbwr - w.cores / 2) * 0.5;
  const sortCpu = w.sortMB * 0.02;
  const racMul = racOn && alive > 1.01 ? 1 + 0.04 * (alive - 1) : 1;
  const cpuC = (w.cpuBase + parse + dbwrCpu + sortCpu) * racMul;

  const io = w.lio * (1 - hit) * 0.8;
  const active = Math.max(1, connected / Math.max(1, alive) * w.sortActive);
  const spill = w.sortMB > 0 ? clamp(1 - (pga * 1024 / active) / w.sortMB, 0, 1) : 0;
  const temp = spill * w.sortMB * 0.5;
  const scan = w.scanMB * 0.12 * (1 + 3 * (1 - Math.min(1, cfg.mbrc / 128))) * (1 + (1 - hit) * 0.2);
  const first = cfg.optimizer_mode !== 'ALL_ROWS';
  const optMul = 1 + w.reportShare * (first ? 0.3 : 0) - (1 - w.reportShare) * (first ? 0.1 : 0);
  const needLB = Math.max(1, w.redoMBps * 1.5);
  const logb = cfg.log_buffer < needLB ? clamp((needLB / cfg.log_buffer - 1) * w.commitW, 0, 60) : 0;
  const cap = cfg.dbwr * 30;
  const fb = cap < w.writeMBps ? clamp((w.writeMBps / cap - 1) * w.writeW, 0, 80) : 0;
  const parEff = Math.min(cfg.pms, w.cores * 2);
  const par = w.batchMs > 0
    ? w.batchMs / (1 + parEff * 0.4) * (cfg.pms > w.cores * 4 ? 1 + (cfg.pms - w.cores * 4) / (w.cores * 4) * 0.5 : 1)
    : 0;

  /* 歸檔 */
  const archOn = cfg.archivelog === 'ARCHIVELOG';
  const archCap = cfg.arch_procs * 4;
  const archWait = archOn && w.redoMBps > archCap * 0.9 ? clamp((w.redoMBps / (archCap * 0.9) - 1) * w.archW, 0, 70) : 0;
  const fraTarget = fraTargetOf(cfg, w);
  const fraUsed = ext.fraUsed != null ? ext.fraUsed : fraTarget;
  const fraFull = archOn && fraUsed >= cfg.fra_size * 0.98;
  const archErr = fraFull ? 0.85 : 0;

  /* RAC：節點之間傳送資料區塊 */
  const gc = racOn && alive > 1.01 ? w.shareFrac * (1 - 1 / alive) * w.gcCost * (part ? 0.2 : 1) : 0;

  const comps = { cpu: cpuC, seq: io, scat: scan, temp, logbuf: logb, freebuf: fb, latch, par, gc, archwait: archWait };
  const base = Object.values(comps).reduce((a, b) => a + b, 0);
  const pre = base * optMul;
  const lat0 = pre * swapMul;
  const tps0 = connected / (w.think + lat0 / 1000);
  const cpuMs = cpuC * optMul * swapMul;
  const util0 = tps0 * cpuMs / 1000 / coresTot;
  const queueF = 1 + Math.max(0, util0 - 0.65) * 4;
  const lat = lat0 * queueF;
  const tps = connected / (w.think + lat / 1000);
  const cpuUtil = clamp(tps * cpuMs / 1000 / coresTot, 0, 1);

  const reportDur = lat / 1000 * (w.reportScale || 0);
  const snapErr = w.reportScale && cfg.undo_retention < reportDur
    ? clamp(0.04 + 0.1 * (reportDur / cfg.undo_retention - 1), 0, 0.3) : 0;
  const undoNeed = cfg.undo_retention * (w.undoMBps || 0);
  const undoErr = w.undoMBps && undoNeed > w.undoSpace ? clamp(undoNeed / w.undoSpace - 1, 0, 1) * 0.3 : 0;
  const err = 1 - (1 - connErr) * (1 - curErr) * (1 - snapErr) * (1 - undoErr) * (1 - shErr) * (1 - archErr);

  const waits = {};
  for (const k in comps) waits[k] = comps[k] * optMul;
  waits.cpu += lat - lat0;
  waits.swap = pre * (swapMul - 1);
  const wsum = Object.values(waits).reduce((a, b) => a + b, 0) || 1;
  const waitList = Object.keys(waits).map(k => ({ k, ms: waits[k], pct: waits[k] / wsum }))
    .filter(x => x.ms > 0.01).sort((a, b) => b.ms - a.ms);

  return {
    users, connected, lat, tps, hit, hardPerSec: tps * hard, cpuUtil, err,
    parts: { conn: connErr, cur: curErr, snap: snapErr, undo: undoErr, shared: shErr, arch: archErr },
    swap: swapMul > 1.02, resident, sga, pga, sharedG: shared, cacheG: cache, asmmOn,
    waits: waitList, reportDur, undoNeed, spill,
    alive, nodes: nodesCfg, failing, fraUsed, fraTarget, fraFull, util: util0
  };
}

const mmss = t => String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function range(p) {

  if (p.k === 'pga') return [0.5, ram, 0.5];
  if (p.k === 'shared_pool_size') return [0.25, ram, 0.25];
  if (p.k === 'db_cache_size') return [0.5, ram, 0.5];
  return [p.min, p.max, p.step];
}
function fmt(p, v) {
  if (p.type === 'seg') return v;
  if (p.k === 'undo_retention') return (v % 60 === 0 ? v / 60 : (v / 60).toFixed(1)) + ' 分鐘';
  const s = String(Math.round(v * 100) / 100);

}
const baseVal = p => (p.kind === 'static' ? S.spfile[p.k] : S.mem[p.k]);

/* ---------- 狀態 ---------- */
function newState(sc) {
  const cfg0 = { ...sc.cfg };
  return {
    sc, t: 0, status: 'open', left: 0, mem: { ...cfg0 }, spfile: { ...cfg0, ...(sc.spfileDiff || {}) },
    lastGood: { ...cfg0 }, staged: {}, pendDef: {}, warm: 1, hist: [], streak: 0, restarts: 0, won: false,
    flags: {}, log: [], hintN: 0, persist: true, failMsg: '', m: null, confirm: false, msgs: [],
    nodesEff: sc.cfg.cluster_db === 'TRUE' ? sc.cfg.rac_nodes : 1, fraUsed: 0, backupCd: 0, failing: false, outage: false
  };
}
function log(level, text) { S.log.unshift({ t: S.t, level, text }); if (S.log.length > 40) S.log.pop(); }

function loadScenario(i) {
  scIndex = i;
  const sc = SCENARIOS[i];
  S = newState(sc);
  for (let t = -40; t < 0; t++) {
    const r = compute(S.mem, sc.w, t, 1);
    S.hist.push({ lat: r.lat, tps: r.tps });
  }
  S.hist = S.hist.slice(-30);

/* ---------- 一秒一格的模擬 ---------- */
function tick() {
  S.t++;
  if (['stopping', 'nomount', 'mount'].includes(S.status)) {
    S.m = null; S.hist.push({ lat: null, tps: 0 }); advanceStartup();
  } else if (S.status === 'failed') {
    S.m = null; S.hist.push({ lat: null, tps: 0 });
  } else {
    S.warm = Math.min(1, S.warm + 0.05);
    for (const k of Object.keys(S.pendDef)) {
      S.pendDef[k].left--;
      if (S.pendDef[k].left <= 0) {
        S.mem[k] = S.pendDef[k].v; delete S.pendDef[k];
        log('ok', `${byKey[k].label} 已套用到新連線`); syncParams(true);
      }
    }
    stepCluster();
    const r = compute(S.mem, S.sc.w, S.t, S.warm, { nodes: S.nodesEff, fraUsed: S.fraUsed });
    const wasFail = S.failing; S.failing = !!r.failing; S.outage = !!r.outage;
    if (S.failing && !wasFail) log(r.outage ? 'crit' : 'warn', r.outage ? '伺服器故障，單一執行個體整個停擺，服務中斷' : `一個節點故障，剩下 ${Math.round(r.alive)} 個節點接手`);
    if (!S.failing && wasFail) log('ok', r.outage ? '服務恢復' : '故障的節點已重新加入叢集');
    if (r.outage) { S.m = null; S.streak = 0; S.hist.push({ lat: null, tps: 0 }); }
    else { S.m = r; S.hist.push({ lat: r.lat, tps: r.tps }); watchFlags(); checkGoal(); }
  }
  if (S.hist.length > 60) S.hist.shift();
  renderDash(); syncParams(false);
}

function stepCluster() {
  const racOn = S.mem.cluster_db === 'TRUE', target = racOn ? S.mem.rac_nodes : 1, old = S.nodesEff;
  S.nodesEff = old < target ? Math.min(target, old + 0.2) : target;
  const a = Math.floor(S.nodesEff + 1e-9), b = Math.floor(old + 1e-9);
  if (a > b) log('ok', `節點 ${a} 已加入叢集`);
  if (a < b) log('warn', `節點數降為 ${a}`);
  if (S.mem.archivelog === 'ARCHIVELOG') S.fraUsed += (fraTargetOf(S.mem, S.sc.w) - S.fraUsed) * 0.02; else S.fraUsed = 0;
  if (S.backupCd > 0) S.backupCd--;
}
function flag(key, on, bad, good) {
  if (on && !S.flags[key]) { S.flags[key] = 1; log('crit', bad); }
  else if (!on && S.flags[key]) { S.flags[key] = 0; log('ok', good); }
}
function watchFlags() {
  const m = S.m, p = m.parts;
  flag('conn', p.conn > 0.01, '連線被拒絕：已達 PROCESSES 上限 (ORA-00020)', '連線數恢復正常');
  flag('cur', p.cur > 0.01, '游標數超過上限，部分交易失敗 (ORA-01000)', '游標錯誤已消失');
  flag('snap', p.snap > 0.01, '報表因快照太舊而失敗 (ORA-01555)', '報表不再因快照太舊失敗');
  flag('undo', p.undo > 0.01, 'Undo 空間被保留時間塞滿 (ORA-30036)', 'Undo 空間恢復');
  flag('swap', m.swap, '實體記憶體不足，系統開始換頁，所有東西都變慢', '記憶體壓力解除');
  flag('spill', m.spill > 0.3, '大量排序溢出到磁碟', '排序回到記憶體內');
  flag('shared', p.shared > 0.01, '共用池不足，無法配置共用記憶體 (ORA-04031)', '共用池夠用了');
  flag('arch', m.fraFull, '快速復原區已滿，所有寫入被卡住 (ORA-00257)', '快速復原區有空間了，寫入恢復');
  flag('archwait', S.mem.archivelog === 'ARCHIVELOG' && m.waits.some(x => x.k === 'archwait' && x.pct > 0.2), '歸檔速度跟不上，交易在等歸檔程序', '歸檔速度跟上了');
  const near = S.mem.archivelog === 'ARCHIVELOG' && !m.fraFull && m.fraUsed >= S.mem.fra_size * 0.8;
  if (near && !S.flags.fraNear) { S.flags.fraNear = 1; log('warn', '快速復原區已用超過 80%'); } else if (!near) S.flags.fraNear = 0;
}
function checkGoal() {
  const g = S.sc.goal, m = S.m;
  const nn = S.mem.cluster_db === 'TRUE' ? S.mem.rac_nodes : 1;
  const ok = m.lat <= g.lat && m.err <= g.err && S.warm >= 0.9
    && (!g.archive || S.mem.archivelog === 'ARCHIVELOG')
    && (!g.maxNodes || nn <= g.maxNodes) && (!g.minNodes || nn >= g.minNodes) && S.nodesEff >= nn - 0.01;
  if (ok) S.streak++; else S.streak = 0;
  if (S.streak >= needOf() && !S.won) win();
}

/* ---------- 重啟流程 ---------- */
function startRestart() {
  S.confirm = false; S.restarts++; S.status = 'stopping'; S.left = 2; S.streak = 0; S.pendDef = {};
  log('warn', '資料庫正在關閉，所有連線中斷');
  renderBar(); renderDash();
}
function advanceStartup() {
  S.left--;
  if (S.left > 0) return;
  if (S.status === 'stopping') { S.status = 'nomount'; S.left = 2; log('info', '啟動執行個體，讀取參數檔'); }

/* ---------- 參數面板 ---------- */

function setStaged(p, v) {

}

/* ---------- 套用 ---------- */
function applyChanges() {
  const msgs = [];
  const memKeys = ['asmm', 'sga_target', 'shared_pool_size', 'db_cache_size'], blocked = new Set();
  const overMax = k => k === 'sga_target' && S.staged[k] > S.mem.sga_max_size;
  if (S.status === 'open' && memKeys.some(k => k in S.staged)) {
    const cand = { ...S.mem };
    memKeys.forEach(k => { if (k in S.staged && !overMax(k)) cand[k] = S.staged[k]; });
    const v = validateSga({ ...cand, sga_target: Math.min(cand.sga_target, cand.sga_max_size) });
    if (!v.ok) { memKeys.forEach(k => { if (k in S.staged && !overMax(k)) blocked.add(k); }); msgs.push(['e', v.msg]); }
  }
  for (const k of Object.keys(S.staged)) {
    if (blocked.has(k)) continue;
    const p = byKey[k], v = S.staged[k], name = p.label;
    if (p.kind === 'static') {
      S.spfile[k] = v; msgs.push(['i', `${name} 已寫入參數檔，重啟後才會生效`]);
    } else if (S.status !== 'open') {
      S.spfile[k] = v; msgs.push(['i', `資料庫沒在運行，${name} 只寫入參數檔`]);
    } else if (k === 'sga_target' && v > S.mem.sga_max_size) {
      if (S.persist) { S.spfile[k] = v; msgs.push(['i', `${name} 超過目前 SGA 上限 ${S.mem.sga_max_size} GB，已寫入參數檔，重啟後生效`]); }
      else { msgs.push(['e', `${name} 不能超過 SGA 上限 ${S.mem.sga_max_size} GB。要調高上限得先重啟`]); continue; }
    } else if (p.kind === 'dynamic') {
      S.mem[k] = v; if (S.persist) S.spfile[k] = v;
      msgs.push(k === 'rac_nodes' && S.mem.cluster_db !== 'TRUE'
        ? ['i', `${name} 已設定，要等叢集模式啟用（需重啟）後才有作用`]
        : ['o', `${name} 已即時生效` + (S.persist ? '' : '（未保存，重啟會消失）')]);
      log('info', `${name} 即時調整為 ${fmt(p, v)}`);
    } else {
      S.pendDef[k] = { v, left: 6 }; if (S.persist) S.spfile[k] = v;
      msgs.push(['i', `${name} 只對新連線生效，舊連線陸續換新`]);
    }
    delete S.staged[k];
  }
  S.msgs = msgs; syncParams(true); renderBar();
  if (S.status === 'open') {
    const r = compute(S.mem, S.sc.w, S.t, S.warm, { nodes: S.nodesEff, fraUsed: S.fraUsed });
    S.m = r.outage ? null : r; renderDash();
  }
}

  const size = S.mem.fra_size, used = Math.min(S.fraUsed, size), pct = used / size;
  const state = pct >= 0.98 ? 'crit' : pct >= 0.8 ? 'warn' : 'ok', w = S.sc.w;
  $('#fraBox').className = 'fra ' + state;
  $('#fraBar').style.width = (pct * 100).toFixed(1) + '%';
  $('#fraTxt').textContent = `${used.toFixed(0)} / ${size} GB`;
  $('#fraSt').textContent = state === 'crit' ? '已滿，寫入被卡住' : state === 'warn' ? '快滿了' : '空間充足';
  $('#fraInfo').textContent = `每小時產生約 ${(w.redoMBps * 3.6).toFixed(0)} GB，保留 ${S.mem.arch_keep} 小時，穩定後約佔 ${fraTargetOf(S.mem, w).toFixed(0)} GB。`;
  const b = $('#fraBtn'); b.disabled = !(S.status === 'open' && S.backupCd === 0);
  b.textContent = S.backupCd > 0 ? `冷卻中 ${S.backupCd} 秒` : '立即備份並清除歸檔';
}
function tile(label, val, unit, state, sub) {
  return `<div class="kpi k-${state}"><span class="kl">${label}</span><b class="kv">${val}<small>${unit}</small></b><span class="ks">${sub}</span></div>`;
}

function chart(sel, data, o) {
  const W = 400, H = 120, L = 44, R = 10, T = 10, B = 14, pw = W - L - R, ph = H - T - B;
  const vals = data.filter(v => v != null);
  const mx = Math.max(1e-9, ...vals, o.goal || 0);
  const top = niceMax(Math.max(mx * 1.15, o.goal ? o.goal * 1.8 : 0));
  const X = i => L + (i + (60 - data.length)) / 59 * pw, Y = v => T + ph - Math.min(v, top) / top * ph;
  let out = '';
  [0, 0.5, 1].forEach(f => {
    const y = T + ph - f * ph;
    out += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="tx" x="${L - 5}" y="${y + 3}" text-anchor="end">${o.fy(top * f)}</text>`;
  });
  if (o.goal) {
    const y = Y(o.goal);
    out += `<line class="gd" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="gt" x="${W - R}" y="${y - 4}" text-anchor="end">目標</text>`;
  }
  let seg = [];
  const flush = () => {
    if (seg.length) {
      const pts = seg.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
      out += `<polygon class="ar" points="${seg[0][0].toFixed(1)},${T + ph} ${pts} ${seg[seg.length - 1][0].toFixed(1)},${T + ph}"/><polyline class="ln" points="${pts}"/>`;
    }
    seg = [];
  };
  data.forEach((v, i) => { if (v == null) flush(); else seg.push([X(i), Y(v)]); });
  const last = seg[seg.length - 1];
  flush();
  if (last) out += `<circle class="dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4"/>`;
  $(sel).innerHTML = out;
}

function renderBar() {
  const st = S.staged, keys = Object.keys(st), stt = S.status;
  let h = '';
  if (keys.length) {
    h += `<div><h4>待套用的變更</h4><ul class="chg">${keys.map(k => {
      const p = byKey[k], kd = KIND[p.kind];
      return `<li><span class="badge ${kd.cls}">${kd.text}</span><span>${p.label}</span><span class="cv">${fmt(p, baseVal(p))} → ${fmt(p, st[k])}</span></li>`;
    }).join('')}</ul>
      <label class="persist"><input type="checkbox" id="persist" ${S.persist ? 'checked' : ''}> 永久保存（同時寫入參數檔）</label>
      <div class="row"><button class="btn primary" data-act="apply">套用變更</button><button class="btn" data-act="discard">放棄變更</button></div></div>`;
  } else if (!S.msgs.length) {
    h += '<p class="bar-idle">調整上面的參數，變更會先列在這裡，確認後再套用。</p>';
  }
  if (S.msgs.length) h += `<ul class="msgs">${S.msgs.map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join('')}</ul>`;
  const pend = Object.keys(S.spfile).filter(k => S.spfile[k] !== S.mem[k]);
  if (pend.length && stt === 'open') {
    h += `<hr class="divider"><div><h4>下次重啟後的差異</h4><ul class="pend">${pend.map(k => {
      const p = byKey[k];
      return `<li>${p.name}：${fmt(p, S.mem[k])} → ${fmt(p, S.spfile[k])}${p.kind === 'static' ? '（待生效）' : '（會被還原）'}</li>`;
    }).join('')}</ul></div>`;
  }
  if (S.confirm) {
    h += `<div class="confirm"><p>重新啟動會中斷所有連線並清空資料快取。${pend.length ? '參數檔的內容會在這時載入。' : '目前參數檔沒有待生效的變更。'}</p>
      <div class="row"><button class="btn danger" data-act="restart-yes">確定重新啟動</button><button class="btn" data-act="restart-no">取消</button></div></div>`;
  } else {
    h += `<div class="row"><button class="btn" data-act="restart" ${stt === 'open' ? '' : 'disabled'}>${stt === 'open' ? '重新啟動資料庫' : stt === 'failed' ? '請先處理上方的啟動失敗' : '重新啟動中…'}</button></div>`;
  }
  $('#bar').innerHTML = h;
}

/* ---------- 事件 ---------- */
function schedule() { clearInterval(timer); if (speed > 0) timer = setInterval(tick, 1000 / speed); }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act) {
    case 'scn': loadScenario(Number(a.dataset.i)); break;
    case 'reset': loadScenario(scIndex); break;
    case 'speed':
      speed = Number(a.dataset.v);
      document.querySelectorAll('.speed button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === speed)));
      schedule(); renderDash(); break;
    case 'seg': { const p = byKey[a.dataset.k]; setStaged(p, a.dataset.v); break; }
    case 'apply': applyChanges(); break;
    case 'discard': S.staged = {}; S.msgs = []; syncParams(true); renderBar(); break;
    case 'restart': S.confirm = true; renderBar(); break;
    case 'restart-no': S.confirm = false; renderBar(); break;
    case 'restart-yes': startRestart(); break;
    case 'retry': retryStart(false); break;
    case 'pfile': retryStart(true); break;
    case 'hint': if (S.hintN < S.sc.hints.length) { S.hintN++; renderHints(); } break;
    case 'backup':
      if (S.status === 'open' && S.backupCd === 0 && S.mem.archivelog === 'ARCHIVELOG') {
        S.fraUsed *= 0.35; S.backupCd = 12; log('ok', '已備份並清除歸檔日誌，快速復原區釋出空間（只是暫時）'); renderDash();
      } break;
    case 'closewin': $('#win').hidden = true; break;
  }
});
document.addEventListener('change', e => { if (e.target.id === 'persist') S.persist = e.target.checked; });

/* 內容沒變就不重畫，避免按鈕在使用者按下的瞬間被換掉 */
['status', 'kpis', 'mem', 'waits', 'log', 'racCard'].forEach(id => {
  const e = document.getElementById(id), d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  Object.defineProperty(e, 'innerHTML', { set(v) { if (this._h !== v) { this._h = v; d.set.call(this, v); } }, get() { return d.get.call(this); } });
});
loadScenario(0);
</script>
